name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-incidentmemai
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: hf-${{ runner.os }}-

      - name: Pre-download embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

      - name: Lint
        run: ruff check app core retrieval rerank

      - name: Security scan
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2026-2288 --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290

      - name: Build Docker image
        run: docker build -t incidentmemai-api:${{ github.sha }} .

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/incidentmemai

            # Save running image for rollback
            OLD_IMAGE=$(sudo docker inspect incidentmemai-api --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # Deploy exact tested commit
            git fetch origin
            git checkout --detach ${{ github.sha }}

            sudo docker build -t incidentmemai-api:${{ github.sha }} .
            sudo docker stop incidentmemai-api || true
            sudo docker rm incidentmemai-api || true
            sudo docker run -d --name incidentmemai-api --network host --env-file .env \
              incidentmemai-api:${{ github.sha }}

            # Health check — 12 attempts × 5 s = 60 s window
            for attempt in $(seq 1 12); do
              if curl --fail --silent http://localhost:8002/health; then
                echo "Health check passed on attempt $attempt"
                sudo docker image prune -f
                exit 0
              fi
              echo "Attempt $attempt failed, retrying in 5s..."
              sleep 5
            done

            # Rollback to previous image
            echo "Health check failed — rolling back"
            sudo docker logs incidentmemai-api --tail 50
            sudo docker stop incidentmemai-api || true
            sudo docker rm incidentmemai-api || true
            if [ -n "$OLD_IMAGE" ]; then
              sudo docker run -d --name incidentmemai-api --network host --env-file .env "$OLD_IMAGE"
              echo "Rolled back to $OLD_IMAGE"
            fi
            exit 1
