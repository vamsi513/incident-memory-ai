name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check app core retrieval rerank

      - name: Security scan
        run: pip install pip-audit && pip-audit 2>&1 || true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml \
            --ignore=tests/test_search_integration.py \
            --ignore=tests/test_generator.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/incidentmemai
            git pull origin main
            sudo docker build -t incidentmemai-api .
            sudo docker stop incidentmemai-api || true
            sudo docker rm incidentmemai-api || true
            sudo docker run -d --name incidentmemai-api --network host --env-file .env incidentmemai-api
            sudo docker image prune -f
