name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-incidentmemai
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-ci.txt -r requirements-dev.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2
          restore-keys: hf-${{ runner.os }}-

      - name: Pre-download embedding model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

      - name: Lint
        run: ruff check app core retrieval rerank

      - name: Security scan
        run: |
          # Upgrade pip itself first -- otherwise pip-audit also flags pip's
          # own version (a build tool, not something the running service
          # ships or executes), which is noise unrelated to this app.
          pip install --upgrade pip
          pip install pip-audit
          # transformers==4.57.1 is the newest version sentence-transformers
          # 3.2.1 allows (it hard-pins transformers<5.0.0) and clears every
          # CVE fixed below 5.0.0. The remaining ones all require either
          # AutoModel.from_pretrained() with an attacker-controlled repo ID,
          # trust_remote_code, save_pretrained(), or chat_template handling
          # (grepped for all four - no matches) - this codebase only loads
          # two fixed, known models (all-MiniLM-L6-v2, ms-marco-MiniLM-L-6-v2)
          # via SentenceTransformer/CrossEncoder, never any of those paths.
          # PYSEC-2025-218 (GLM4 deserialization RCE): unreachable, no GLM4
          # model ever loaded.
          # PYSEC-2026-2288/2289/2290 and CVE-2026-9856: same reasoning as
          # above (trust_remote_code bypass / save_pretrained path traversal).
          pip-audit --ignore-vuln PYSEC-2025-217 --ignore-vuln PYSEC-2025-218 --ignore-vuln PYSEC-2026-2288 --ignore-vuln PYSEC-2026-2289 --ignore-vuln PYSEC-2026-2290 --ignore-vuln CVE-2026-9856

      - name: Build Docker image
        run: docker build -t incidentmemai-api:${{ github.sha }} .

      - name: Run tests
        run: pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # SSH on the host's security group is locked to a single home IP, so the
    # runner (a different IP every run) can't reach port 22 by default. Open
    # it just for this runner's own IP for the life of the job, then close it
    # again in a cleanup step that runs even if the deploy fails. Same
    # pattern as evalforge's ci.yml, which manages this same shared SG.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DEPLOY_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SG_ID: sg-0c7f5612c7d11e8f4

    steps:
      - name: Allow this runner's IP through SSH
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)/32"
          echo "RUNNER_CIDR=$RUNNER_IP" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=$RUNNER_IP,Description='CI runner ${{ github.run_id }}'}]"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ec2-user/incidentmemai

            # Save running images for rollback (both services)
            OLD_API_IMAGE=$(sudo docker inspect incidentmemai-api --format='{{.Config.Image}}' 2>/dev/null || echo "")
            OLD_APP_IMAGE=$(sudo docker inspect incidentmemai-app --format='{{.Config.Image}}' 2>/dev/null || echo "")

            # Deploy exact tested commit
            git fetch origin
            git checkout --detach ${{ github.sha }}

            sudo docker build -t incidentmemai-api:${{ github.sha }} .

            # Health-checks one container by name/port, retrying, and reports
            # success (0) or failure (1) without exiting the whole script --
            # both services need to get their own deploy attempt regardless
            # of how the other one goes.
            check_health() {
              local port=$1
              for attempt in $(seq 1 12); do
                if curl --fail --silent "http://localhost:${port}/health" >/dev/null; then
                  echo "Health check passed on attempt $attempt (port $port)"
                  return 0
                fi
                echo "Attempt $attempt failed on port $port, retrying in 5s..."
                sleep 5
              done
              return 1
            }

            API_OK=1
            APP_OK=1

            # --- incidentmemai-api (api.main:app, retrieval-only, port 8002) ---
            sudo docker stop incidentmemai-api || true
            sudo docker rm incidentmemai-api || true
            sudo docker run -d --name incidentmemai-api --network host --env-file .env \
              incidentmemai-api:${{ github.sha }}

            if check_health 8002; then
              API_OK=0
            else
              echo "incidentmemai-api health check failed — rolling back"
              sudo docker logs incidentmemai-api --tail 50
              sudo docker stop incidentmemai-api || true
              sudo docker rm incidentmemai-api || true
              if [ -n "$OLD_API_IMAGE" ]; then
                sudo docker run -d --name incidentmemai-api --network host --env-file .env "$OLD_API_IMAGE"
                echo "Rolled back incidentmemai-api to $OLD_API_IMAGE"
              fi
              API_OK=1
            fi

            # --- incidentmemai-app (app.main:app, retrieval + LLM generation
            # with citations and a no-answer path, port 8003) — same image,
            # different entrypoint command; no separate build needed. This is
            # what the Streamlit UI's API_BASE_URL actually points at. ---
            sudo docker stop incidentmemai-app || true
            sudo docker rm incidentmemai-app || true
            sudo docker run -d --name incidentmemai-app --network host --env-file .env \
              incidentmemai-api:${{ github.sha }} \
              uvicorn app.main:app --host 0.0.0.0 --port 8003

            if check_health 8003; then
              APP_OK=0
            else
              echo "incidentmemai-app health check failed — rolling back"
              sudo docker logs incidentmemai-app --tail 50
              sudo docker stop incidentmemai-app || true
              sudo docker rm incidentmemai-app || true
              if [ -n "$OLD_APP_IMAGE" ]; then
                sudo docker run -d --name incidentmemai-app --network host --env-file .env \
                  "$OLD_APP_IMAGE" uvicorn app.main:app --host 0.0.0.0 --port 8003
                echo "Rolled back incidentmemai-app to $OLD_APP_IMAGE"
              fi
              APP_OK=1
            fi

            if [ "$API_OK" -eq 0 ] && [ "$APP_OK" -eq 0 ]; then
              # `docker image prune -f` only removes dangling images, but every
              # deploy tags a new image by commit SHA, so old deploys are never
              # dangling and pile up until the disk fills. Explicitly drop every
              # tagged incidentmemai-api image except the one just deployed and
              # the ones either service rolled back to.
              KEEP_IMAGE="incidentmemai-api:${{ github.sha }}"
              sudo docker images incidentmemai-api --format '{{.Repository}}:{{.Tag}}' | while read -r img; do
                if [ "$img" != "$KEEP_IMAGE" ] && [ "$img" != "$OLD_API_IMAGE" ] && [ "$img" != "$OLD_APP_IMAGE" ]; then
                  sudo docker rmi "$img" || true
                fi
              done
              # Best-effort: buildkit runs its own background GC right after a
              # build, which can hold this lock and make prune fail with "a
              # prune operation is already running" even though the deploy
              # itself succeeded (image already removed above). Non-fatal.
              sudo docker image prune -f || true
              exit 0
            fi

            exit 1

      - name: Revoke this runner's IP from SSH
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp --port 22 --cidr "$RUNNER_CIDR" || true
